name: personal-workbench

services:
  db:
    image: postgres:16
    container_name: pwb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pwb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-personal_workbench}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres.conf:/etc/postgresql/override.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/override.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pwb} -d ${POSTGRES_DB:-personal_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [pwb]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pwb-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pwb}:${POSTGRES_PASSWORD:-pwb_pass}@db:5432/${POSTGRES_DB:-personal_workbench}
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [pwb]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: pwb-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    volumes:
      - uploads:/var/www/uploads:ro
    networks: [pwb]

  backup:
    image: postgres:16
    container_name: pwb-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pwb}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pwb_pass}
      PGDATABASE: ${POSTGRES_DB:-personal_workbench}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [pwb]

volumes:
  pgdata:
    name: pwb_pgdata
  uploads:
    name: pwb_uploads
  backups:
    name: pwb_backups

networks:
  pwb:
    name: pwb_net
    driver: bridge
