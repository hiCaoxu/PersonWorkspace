# PostgreSQL 16 —— 2C2G 轻量服务器配置
# 通过 docker-compose 的 config_file 挂载生效，仅列非默认值。

# 网络：容器间必须监听所有地址
listen_addresses = '*'
port = 5432

# 内存
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
max_connections = 50

# WAL 与检查点（单机自用，允许最小化 WAL）
wal_level = minimal
max_wal_senders = 0
checkpoint_completion_target = 0.9
random_page_cost = 1.1

# 日志
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500ms
log_timezone = 'Asia/Shanghai'
timezone = 'Asia/Shanghai'

# 注意：pg_trgm 在 C locale 下不会为汉字生成 trigram，
# 中文模糊匹配由 ILIKE 保证正确性，GIN 索引仅对 ASCII 起加速作用。
