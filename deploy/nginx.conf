upstream pwb_api {
    server api:8000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 安全响应头（子级 location 若新增 add_header 会覆盖此处，故子级只用 expires）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 登录接口单独限流，防口令爆破
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://pwb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://pwb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传图片直出，长缓存
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # 构建产物带 hash，永久缓存
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # 注意：location 里再写 add_header 会丢弃 server 级的安全响应头，
    # 因此这里只用 expires / default_type，不覆盖 add_header。
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
